[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "paim"
version = "0.1.0"
description = "Practical AI Management common integrity kernel"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.141.1,<0.142",
    "jinja2>=3.1.6,<3.2",
    "python-multipart>=0.0.32,<0.1",
    "sqlalchemy>=2.0.48,<2.1",
    "uvicorn>=0.52.1,<0.53",
    "uuid6>=2025.0.1,<2026",
]

[project.scripts]
paim-local = "paim.operational.cli:main"
paim-web = "paim.web.cli:main"
paim-launcher = "paim.web.launcher:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1,<2.10",
    "mypy>=1.18,<2",
    "pytest-playwright>=0.8,<0.9",
    "pytest>=9,<10",
    "ruff>=0.14,<1",
]

[tool.uv]
required-version = "==0.12.5"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
    "browser: bounded Playwright browser acceptance tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/paim"]
